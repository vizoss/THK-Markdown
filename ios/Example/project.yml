name: Example
options:
  bundleIdPrefix: com.thk.mdview.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Example:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../examples/weekly/weekly.json
        buildPhase: resources
        group: WeeklyResources
      - path: ../../examples/sse/replies.json
        buildPhase: resources
        group: SSEResources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thk.mdview.example
        DEVELOPMENT_TEAM: FRBL9GK76M
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: THKMDView
        product: THKMDView
      - package: THKMDView
        product: MarkdownFixtures
  THKMDViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/THKMDViewTests
      - path: ../Tests/Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: Example
      - package: THKMDView
        product: THKMDView
      - package: THKMDView
        product: MarkdownFixtures
schemes:
  Example:
    build:
      targets:
        Example: all
        THKMDViewTests: [test]
    test:
      targets: [THKMDViewTests]
packages:
  THKMDView:
    path: ../
