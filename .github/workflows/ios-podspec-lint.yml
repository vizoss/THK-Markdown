name: iOS – binary CocoaPods package
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION=$(bash scripts/release-version.sh)
          else
            # Manual branch runs validate a candidate without creating/moving a release tag.
            VERSION=$(sed -n 's/^VERSION_NAME=//p' android/gradle.properties)
            VERSION=$(GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$VERSION" bash scripts/release-version.sh)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test binary dependency guard
        run: |
          bash ios/scripts/test-parser-dependencies.sh
          ruby ios/scripts/test-swift-interfaces.rb
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          gem install cocoapods --no-document
      - name: Build and lint binary pod (no simulator launch)
        run: bash ios/scripts/build-xcframework.sh
      - name: Upload verified binary artifacts (tag releases published by ios-release.yml)
        uses: actions/upload-artifact@v4
        with:
          name: THKMDView-${{ steps.version.outputs.version }}-binary
          path: |
            ios/Binary/build-*/THKMDView-*.zip
            ios/Binary/build-*/SHA256SUMS
            ios/Binary/build-*/release/THKMDView.podspec
          if-no-files-found: error
