name: iOS – binary CocoaPods package
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'THKMDView.podspec'
      - '.github/workflows/ios-podspec-lint.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          gem install cocoapods --no-document
      - name: Build and lint binary pod (no simulator launch)
        run: bash ios/scripts/build-xcframework.sh
      - name: Keep candidate artifacts (no release publication)
        uses: actions/upload-artifact@v4
        with:
          name: THKMDView-binary-candidate
          path: |
            ios/Binary/build-*/THKMDView-*.zip
            ios/Binary/build-*/SHA256SUMS
            ios/Binary/build-*/release/THKMDView.podspec
          if-no-files-found: error
