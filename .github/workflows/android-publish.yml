name: Android – publish AAR to GitHub Packages

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - name: Validate release tag and version
        id: version
        run: |
          VERSION=$(bash ../scripts/release-version.sh)
          echo "publish_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Keep the existing SDK command-line tools while migrating the action to Node 24.
          cmdline-tools-version: '12266719'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :thkmdview:testDebugUnitTest --stacktrace

      # Published Maven versions are immutable; use a new tag for a new release.
      - name: Publish :thkmdview to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :thkmdview:publish \
            -PVERSION_NAME=${{ steps.version.outputs.publish_version }}

      - name: Summary
        run: |
          echo "### Published \`com.thk.mdview:thkmdview:${{ steps.version.outputs.publish_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "to https://github.com/vizoss/THK-Markdown/packages" >> "$GITHUB_STEP_SUMMARY"
