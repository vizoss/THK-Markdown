name: Android – publish AAR to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :thkmdview:testDebugUnitTest --stacktrace

      - name: Compute publish version
        id: version
        run: |
          BASE_VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          PUBLISH_VERSION="${BASE_VERSION}-build${{ github.run_number }}"
          echo "publish_version=${PUBLISH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${PUBLISH_VERSION}"

      # GitHub Packages Maven registry rejects republishing an existing version, so every
      # push to main gets a unique "<VERSION_NAME>-build<run_number>" version. Tag a real
      # release manually (bump VERSION_NAME in gradle.properties) when you want a stable,
      # human-chosen version number instead of a build-numbered one.
      - name: Publish :thkmdview to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :thkmdview:publish \
            -PVERSION_NAME=${{ steps.version.outputs.publish_version }}

      - name: Summary
        run: |
          echo "### Published \`com.thk.mdview:thkmdview:${{ steps.version.outputs.publish_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "to https://github.com/vizoss/THK-Markdown/packages" >> "$GITHUB_STEP_SUMMARY"
