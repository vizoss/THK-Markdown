name: iOS – publish verified binary release

on:
  workflow_run:
    workflows: ['iOS – binary CocoaPods package']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful tag build run ID to publish'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: ios-binary-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Publish verified tag artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
        run: bash scripts/publish-ios-release.sh
